name: Validate skills and MCP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate skills and eval fixtures
        run: python -X utf8 ad-skill-jam/_shared/evals/check_pack.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install and test the MCP
        working-directory: ad-skill-jam/mcp
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
      - name: Smoke-test desktop bundle and runtime SBOM
        if: github.ref_type != 'tag'
        working-directory: ad-skill-jam/mcp
        run: npm run bundle

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check for an existing published release
        id: release-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          published=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            jq -r --arg tag "$GITHUB_REF_NAME" 'any(.[][]; .tag_name == $tag and .draft == false)')
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [[ "$published" == true ]]; then
            echo "Release $GITHUB_REF_NAME already exists."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release-state.outputs.published == 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.release-state.outputs.published == 'false'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare release notes and build the desktop bundle
        if: steps.release-state.outputs.published == 'false'
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${GITHUB_REF_NAME#v}
          test "$(node -p 'require("./ad-skill-jam/mcp/package.json").version')" = "$version"
          awk -v heading="## [$version] - " '
            index($0, heading) == 1 { active = 1; next }
            /^## / && active { exit }
            active { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/adjam-release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/adjam-release-notes.md"
          cd ad-skill-jam/mcp
          npm ci --ignore-scripts
          npm run bundle
      - name: Attest desktop bundle build provenance
        if: steps.release-state.outputs.published == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ad-skill-jam/mcp/dist/ad-skill-jam.mcpb
      - name: Attest desktop bundle runtime SBOM
        if: steps.release-state.outputs.published == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ad-skill-jam/mcp/dist/ad-skill-jam.mcpb
          sbom-path: ad-skill-jam/mcp/dist/ad-skill-jam-mcp.sbom.json
      - name: Publish GitHub release
        if: steps.release-state.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" ad-skill-jam/mcp/dist/ad-skill-jam-mcp.sbom.json \
            ad-skill-jam/mcp/dist/ad-skill-jam.mcpb \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Ad Skill Jam $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/adjam-release-notes.md" --latest
